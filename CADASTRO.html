<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <h2>Sistema de Cadastro</h2>
    <form>
        <p>Preencha todos os campos abaixo para concluir seu cadastro.</p>
        <!--Campo de Dados Pessoais-->
        <fieldset>
            <legend>Dados Pessoais</legend>
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
            <label for="CPF">CPF:</label>
            <input type="text" id="CPF" name="CPF" placeholder="000.000.000-00" required></td>
            <label for="Sexo">Sexo:</label>
            <select id="Sexo" name="Sexo" required>
                <option value="">Selecione</option>
                <option value="M">Masculino</option>
                <option value="F">Feminino</option>
            </select><br>
            <label for="nascimento">Data de Nascimento:</label><br>
            <input type="nascimento" id="nascimento" name="nascimento" placeholder="dd/mm/aaaa" required><br>
            <label for="rg">RG:</label><br>
            <input type="rg" id="rg" name="rg" placeholder="Digite seu RG" required><br>
        </fieldset>
    </form>
    <!--Campo de Contato-->
    <form>
    <fieldset>
            <legend>Contato</legend>
            <label for="email">E-mail</label><br>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required><br>
            <label for="telefone">Telefone</label><br>
            <input type="text" id="telefone" name="telefone" placeholder="(00) 0000-0000" required><br>
            <label for="endereço">Endereço:</label><br>
            <input type="text" id="endereço" name="endereço" placeholder="Digite seu endereço completo" required><br>
            <label for="Cidade">Cidade:</label><br>
            <input type="text" id="Cidade" name="Cidade" placeholder="Digite sua cidade" required><br>
            <label for="estado">Estado:</label><br>
            <label for="Profissão">Profissão:</label><br>
        <select type="text" id="Profissão" name="Profissão" placeholder="Digite sua profissão">
                <option value="" selected>Selecione</option>
                <option value="sp" selected>São Paulo</option>
                <option value="RJ" selected>Rio de Janeiro</option>
                <option value="MG" selected>Minas Gerais</option>
                <option value="RS" selected>Rio Grande do Sul</option>
                <option value="BA" selected> Bahia</option>
                <option value="PE" selected>Pernambuco</option>
                <option value="CE" selected>Ceará</option>
                <option value="PI" selected>Piauí</option>
                <option value="PA" selected>Pará</option>
                <option value="RN" selected>Rio Grande do Norte</option>
                <option value="SC" selected>Santa Catarina</option>
                <option value="AM" selected>Amazonas</option>
            </select>
    </fieldset> 
</form>
    <!--Campo de Acesso-->
    <form>
      <fieldset>
        <legend>Acesso</legend>
        <label for="senha">Senha:</label><br>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required><br>
        <label for="Confirme a senha"> Confirme a senha:</label><br>
        <input type="password" id="confirme sua senha" name="confirme sua senha" placeholder="confirme sua senha" required><br>
      </fieldset>
    </form>
    <!--Campo de informacoes adicionais-->
    <form>
      <fieldset>
        <legend>Informações Adicionais</legend>
        <label for="Profissão">Profissão:</label><br>
        <input type="text" id="Profissão" name="Profissão" placeholder="Digite sua profissão"><br>
        <label for="Conhecer">Como você nos conheceu?</label><br>
        <select id="conhecer" name="conhecer" required>
            <option value="selecione" selected>Selecione</option>
            <option value="indicacao">Indicação</option>
            <option value="internet">Internet</option>
            <option value="outros">Outros</option>
        </select>
      </fieldset>
    </form>
  </body>
</html>
