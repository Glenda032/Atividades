<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <h1>Sistema de Cadastro</h1>
    <form>
        <p>Preencha todos os campos abaixo para concluir seu cadastro.</p>
                                           <!--Campo de Dados Pessoais-->
        <fieldset>
            <legend>Dados Pessoais</legend>
            <table style="width: 100%;
            border-collapse: collapse;">
              <tr>
                <td style="width: 50%;
                padding: 4px;">
            <label for="nome">Nome Completo:</label><br>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" 
            required style="width: 95%;
            margin-top: 5px;">
                </td>
                <td style="width: 50%;
                padding: 4px;">
            <label for="nascimento">Data de Nascimento:</label><br>
            <input type="nascimento" id="nascimento" name="nascimento" placeholder="dd/mm/aaaa" 
            required style="width: 95%;
            margin-top: 5px;"><br>
                </td>
            </tr>
              <tr>
                <td style="width: 50%;
                padding: 4px;">
            <label for="CPF">CPF:</label><br>
            <input type="text" id="CPF" name="CPF" placeholder="000.000.000-00" 
            required style="width: 95%;
            margin-top: 5px;">
              <td style="width: 50%;
              padding: 4px;">
            <label for="rg">RG:</label><br>
            <input type="rg" id="rg" name="rg" placeholder="Digite seu RG"
            required style="width: 95%;
            margin-top: 5px;"><br>
           </td>
        </table>
            <table style="width: 100%;
            border-collapse: collapse;">
              <tr>
                <td style="width: 50%;
                padding: 4px;">
            <label for="Sexo">Sexo:</label><br>
            <select id="Sexo" name="Sexo"
            required style="width: 48%;
             margin-top: 5px;">
                <option value="">Selecione</option>
                <option value="M">Masculino</option>
                <option value="F">Feminino</option>
              </select>
              </td>
           </tr>
           </table>
        </fieldset>
    </form>
                                          <!--Campo de Contato-->
    <form>
    <fieldset>
            <legend>Contato</legend>
            <table style="width: 100%;
            border-collapse: collapse;">
              <tr>
                <td style="width: 50%;
                padding: 4px;">
            <label for="email">E-mail</label><br>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" 
            required style="width: 95%;
            margin-top: 5px;"><br>
                </td>

                <td style="width: 50%;
                padding: 4px;">
            <label for="telefone">Telefone</label><br>
            <input type="text" id="telefone" name="telefone" placeholder="(00) 0000-0000" 
            required style="width: 95%;
            margin-top: 5px;"><br>
                </td>
              </tr>
 
              <table style="width: 100%;
            border-collapse: collapse;">
                <tr>
                <td style="width: 100%;
                padding: 4px;">
            <label for="endereço">Endereço:</label><br>
            <input type="text" id="endereço" name="endereço" placeholder="Digite seu endereço completo" 
            required style="width: 98%;
             margin-top: 5px;"><br>
                </td>
              </tr>

              <table style="width: 100%;
            border-collapse: collapse;">
              <tr>
                <td style="width: 50%;
                padding: 4px;">
            <label for="Cidade">Cidade:</label><br>
            <input type="text" id="Cidade" name="Cidade" placeholder="Digite sua cidade"
             required style="width: 95%;
             margin-top: 5px;"><br>
                </td>

                <td style="width: 50%;
                padding: 4px;">
            <label for="estado">Estado:</label><br>
            <select id="estado" name="estado" 
            required style="width: 95%;
            margin-top: 5px;">
                <option value="" selected>Selecione</option>
                <option value="sp" selected>São Paulo</option>
                <option value="RJ" selected>Rio de Janeiro</option>
                <option value="MG" selected>Minas Gerais</option>
                <option value="RS" selected>Rio Grande do Sul</option>
                <option value="BA" selected> Bahia</option>
                <option value="PE" selected>Pernambuco</option>
                <option value="CE" selected>Ceará</option>
                <option value="PI" selected>Piauí</option>
                <option value="PA" selected>Pará</option>
                <option value="RN" selected>Rio Grande do Norte</option>
                <option value="SC" selected>Santa Catarina</option>
                <option value="AM" selected>Amazonas</option>
            </select>
              </tr>
            </table>
    </fieldset> 
</form>
    <!--Campo de Acesso-->
    <form>
      <fieldset>
        <legend>Acesso</legend>
        <table style="width: 100%;
            border-collapse: collapse;">
        <tr>
          <td style="width: 50%;
          padding: 4px;">
            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" 
            required style="width: 95%;
            margin-top: 5px;"><br>
          </td>

          <td style="width: 50%;
          padding: 4px;">
            <label for="Confirme a senha"> Confirme a senha:</label><br>
        <input type="password" id="confirme sua senha" name="confirme sua senha" placeholder="confirme sua senha" 
        required style="width: 95%;
        margin-top: 5px;"><br>
          </td>
          </tr>
        </table>
      </fieldset>
    </form>
    <!--Campo de informacoes adicionais-->
    <form>
      <fieldset>
        <legend>Informações Adicionais</legend>
       <table style="width: 100%;
       border-collapse: collapse;">
        <tr>
          <td style="width: 50%;
          padding: 4px;">
        <label for="Profissão">Profissão:</label><br>
        <input type="text" id="Profissão" name="Profissão" placeholder="Digite sua profissão" 
        required style="width: 95%;
        margin-top: 5px;"><br>
          </td>

          <td style="width: 50%;
          padding: 4px;">
            <label for="Conhecer">Como você nos conheceu?</label><br>
            <select id="conhecer" name="conhecer" 
            required style="width: 95%;
            margin-top: 5px;">
            <option value="selecione" selected>Selecione</option>
            <option value="indicacao">Indicação</option>
            <option value="internet">Internet</option>
            <option value="outros">Outros</option>
        </select>
          </td>
        </tr>
       </table>
      </fieldset>
    </form>
     <!--termos e condições-->
    <form>
      <tr>
        <td>
      <input type="checkbox" id="termos" name="termos" required>
      <label for="termos" style="font-size: 14px;">Li e aceito os <i>termos de uso</i> e a <i>política de privacidade</i></label>
        </td>
  </tr>
    </form>
    <p>
      <button type="submit">Cadastrar</button> 
    </p>
  </body>
</html>
